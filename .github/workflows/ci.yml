name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  arduino-avr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
      - name: Compile Nano RAM example
        run: arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-nano-ram" --warnings all examples/MinimalRecorder
      - name: Compile Nano EEPROM example
        run: arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-nano-eeprom" --warnings all examples/AVREepromRecorder
      - name: Compile old bootloader selection
        run: arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-nano-old" --warnings all examples/AVREepromRecorder
      - name: Install Adafruit AVR core
        run: |
          arduino-cli core update-index --additional-urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core install adafruit:avr@1.4.15 --additional-urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
      - name: Compile Pro Trinket examples
        run: |
          arduino-cli compile --fqbn adafruit:avr:protrinket5 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-trinket-ram" examples/MinimalRecorder
          arduino-cli compile --fqbn adafruit:avr:protrinket5 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-trinket-eeprom" examples/AVREepromRecorder
      - name: Validate Nano ZIP consumer
        run: |
          mkdir -p "$RUNNER_TEMP/avr-package/TinyFault" "$RUNNER_TEMP/avr-consumer"
          cp -R src examples library.properties LICENSE README.md "$RUNNER_TEMP/avr-package/TinyFault/"
          (cd "$RUNNER_TEMP/avr-package" && zip -qr "$RUNNER_TEMP/TinyFault-AVR.zip" TinyFault)
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --zip-path "$RUNNER_TEMP/TinyFault-AVR.zip"
          cp -R examples/AVREepromRecorder "$RUNNER_TEMP/avr-consumer/"
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328 --build-path "$RUNNER_TEMP/tinyfault-nano-installed" "$RUNNER_TEMP/avr-consumer/AVREepromRecorder"
  arduino-esp32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile minimal example
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-minimal" --warnings all examples/MinimalRecorder
      - name: Compile persistent example
        run: arduino-cli compile --fqbn esp32:esp32:esp32:FlashMode=dio,FlashFreq=40 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-arduino" --warnings all examples/ESP32PersistentRecorder
      - name: Compile ESP32-S3 example
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-arduino-s3" --warnings all examples/ESP32PersistentRecorder
      - name: Compile ESP32-C3 example
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-arduino-c3" --warnings all examples/ESP32PersistentRecorder
      - name: Compile diagnostics example
        run: arduino-cli compile --fqbn esp32:esp32:esp32:FlashMode=dio,FlashFreq=40 --libraries "$GITHUB_WORKSPACE/.." --build-path "$RUNNER_TEMP/tinyfault-diagnostics" --warnings all examples/ESP32Diagnostics
      - name: Validate ZIP installation outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/package/TinyFault" "$RUNNER_TEMP/consumer"
          cp -R src examples library.properties LICENSE README.md "$RUNNER_TEMP/package/TinyFault/"
          (cd "$RUNNER_TEMP/package" && zip -qr "$RUNNER_TEMP/TinyFault.zip" TinyFault)
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --zip-path "$RUNNER_TEMP/TinyFault.zip"
          cp -R examples/MinimalRecorder "$RUNNER_TEMP/consumer/"
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-path "$RUNNER_TEMP/tinyfault-installed" --warnings all "$RUNNER_TEMP/consumer/MinimalRecorder"
      - name: Install Espressif QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          curl -fL --retry 3 -o "$RUNNER_TEMP/qemu.tar.xz" https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          echo "0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35  $RUNNER_TEMP/qemu.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tinyfault-qemu"
          tar -xf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP/tinyfault-qemu"
      - name: Test recovery in QEMU
        run: |
          QEMU_BIN=$(find "$RUNNER_TEMP/tinyfault-qemu" -name qemu-system-xtensa -type f -print -quit)
          test -n "$QEMU_BIN"
          python3 tests/qemu_smoke.py --qemu "$QEMU_BIN" --image "$RUNNER_TEMP/tinyfault-arduino/ESP32PersistentRecorder.ino.merged.bin"
          python3 tests/qemu_diagnostics.py --qemu "$QEMU_BIN" --image "$RUNNER_TEMP/tinyfault-diagnostics/ESP32Diagnostics.ino.merged.bin"
